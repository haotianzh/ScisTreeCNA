# Read the Docs configuration for the ScisTreeCNA documentation.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# ScisTreeCNA's docs are a Jupyter Book 2 site, which is built by mystmd (a
# Node.js toolchain) rather than by Sphinx. Read the Docs therefore runs a
# custom `build.commands` recipe instead of its built-in Sphinx builder.
#
# Note: the notebooks under docs/tutorials/ are NOT executed here. They require
# an NVIDIA GPU, which Read the Docs builders do not have, so they are committed
# with their outputs already stored. See docs/README.md.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "22"
  commands:
    # Pin the major version: Jupyter Book 1.x and 2.x are entirely different
    # tools and 2.x is the one this project's myst.yml targets.
    - npm install -g jupyter-book@2
    - cd docs && jupyter-book build --html
    - mkdir -p "$READTHEDOCS_OUTPUT/html"
    - cp -r docs/_build/html/. "$READTHEDOCS_OUTPUT/html"
